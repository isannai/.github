<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 254" width="952" height="254"
     role="img" aria-labelledby="nid-t nid-d">
  <title id="nid-t">Hardware fingerprint to node address</title>
  <desc id="nid-d">The mainboard UUID and TPM fingerprint are run through HKDF-SHA256 to derive a
secp256k1 private key, from which the node EOA address follows. The private key is never stored on disk.</desc>

  <defs>
    <linearGradient id="idw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#4fd1ff"/>
    </linearGradient>
    <marker id="idArw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4fd1ff"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="951" height="253" rx="20" fill="#111a2b" stroke="#26324e"/>

  <g transform="translate(26 32)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">

    <!-- 입력 -->
    <rect x="10" y="18" width="186" height="46" rx="11" fill="#153038" stroke="#1c524c"/>
    <text x="26" y="40" fill="#9ff0cd" font-size="12" font-weight="700">Mainboard UUID</text>
    <text x="26" y="56" fill="#6b7aa0" font-size="10">not replaceable &#183; unique to the board</text>

    <rect x="10" y="80" width="186" height="46" rx="11" fill="#153038" stroke="#1c524c"/>
    <text x="26" y="102" fill="#9ff0cd" font-size="12" font-weight="700">fTPM EK fingerprint</text>
    <text x="26" y="118" fill="#6b7aa0" font-size="10">security chip cert SHA-256</text>

    <rect x="10" y="140" width="186" height="38" rx="11" fill="#0b1220" stroke="#26324e" stroke-dasharray="4 4"/>
    <text x="26" y="164" fill="#6b7aa0" font-size="10.5">GPU UUID when no TPM</text>

    <path d="M200 41 C 232 41, 232 82, 262 82" fill="none" stroke="url(#idw)" stroke-width="1.8"/>
    <path d="M200 103 C 232 103, 232 88, 262 88" fill="none" stroke="url(#idw)" stroke-width="1.8"/>

    <!-- 유도 -->
    <rect x="264" y="58" width="176" height="56" rx="12" fill="#183044" stroke="#24516b"/>
    <text x="352" y="82" text-anchor="middle" fill="#9fe6ff" font-size="13" font-weight="700">HKDF-SHA256</text>
    <text x="352" y="99" text-anchor="middle" fill="#6b7aa0" font-size="10">salt: iann-node-v1</text>

    <path d="M444 86 L500 86" stroke="url(#idw)" stroke-width="2" marker-end="url(#idArw)"/>

    <rect x="506" y="58" width="168" height="56" rx="12" fill="#202644" stroke="#36376b"/>
    <text x="590" y="82" text-anchor="middle" fill="#cfc6ff" font-size="13" font-weight="700">secp256k1 key</text>
    <text x="590" y="99" text-anchor="middle" fill="#6b7aa0" font-size="10">lives in memory only</text>

    <path d="M678 86 L730 86" stroke="url(#idw)" stroke-width="2" marker-end="url(#idArw)"/>

    <!-- 결과 -->
    <rect x="736" y="52" width="154" height="68" rx="12" fill="#183044" stroke="#24516b"/>
    <text x="813" y="78" text-anchor="middle" fill="#e8edfb" font-size="12.5" font-weight="700">Node EOA</text>
    <text x="813" y="96" text-anchor="middle" fill="#9fe6ff" font-size="11">0x9f3c&#8230;a71b</text>
    <text x="813" y="112" text-anchor="middle" fill="#6b7aa0" font-size="9.5">= node id</text>

    <text x="450" y="160" text-anchor="middle" fill="#ff6b81" font-size="11" font-weight="700">The private key is never written to disk. It is recomputed from hardware on every start.</text>
  </g>
</svg>
